name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (ex: v1.0.0)"
        required: true
        type: string

jobs:
  deploy:
    uses: voikyrioh/infra-dashboard/.github/workflows/build-deploy.yml@main
    permissions:
      contents: write
      packages: write
    with:
      app-name: chess
      tag: ${{ inputs.tag }}
    secrets: inherit
