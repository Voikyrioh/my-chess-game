<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="src/game/html/assets/chess-pieces-svg/wking.svg" />
    <link rel="stylesheet" href="./src/assets/style/globals.css">
    <link rel="stylesheet" href="./src/assets/style/small.css" media="screen and (max-width: 90em)" />
    <link rel="stylesheet" href="./src/assets/style/large.css" media="screen and (min-width: 90em)" />
    <script src="index.ts" type="module"></script>
    <title>ChessGame</title>
  </head>
  <body>
    <aside>
      <div id="title"><img src="src/game/html/assets/chess-pieces-svg/wking.svg" alt="logo"><h1>ChessGame</h1></div>
      <button class="menu-display" id="settings-btn" aria-label="settings">
        <input type="checkbox" id="checkbox-menu-options" hidden/>
        <img src="src/assets/web/options.svg" alt="options button">
      </button>
      <div id="options">
        <div class="option">
          <label for="gametype">Plateau en 3D (inDev)</label>
          <div class="switch">
            <input id="gametype" type="checkbox">
            <span class="slider"></span>
          </div>
        </div>
      </div>
      <footer>Made by <a href="https://github.com/Voikyrioh" target="_blank">Voikyrioh</a></footer>
    </aside>
    <div id="app">
    </div>
  </body>
</html>
